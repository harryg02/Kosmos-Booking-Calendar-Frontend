<style>

/* --- Include Hover states for all combinations --- */

.flatpickr-day.startRange.prevMonthDay:hover,
.flatpickr-day.endRange.prevMonthDay:hover,
.flatpickr-day.selected.nextMonthDay:hover,
.flatpickr-day.startRange.nextMonthDay:hover,
.flatpickr-day.endRange.nextMonthDay:hover,
/* --- Include Focus states for all combinations --- */
.flatpickr-day.selected:focus,
.flatpickr-day.startRange:focus,
.flatpickr-day.endRange:focus,
.flatpickr-day.selected.prevMonthDay:focus,
.flatpickr-day.startRange.prevMonthDay:focus,
.flatpickr-day.endRange.prevMonthDay:focus,
.flatpickr-day.selected.nextMonthDay:focus,
.flatpickr-day.startRange.nextMonthDay:focus,
.flatpickr-day.endRange.nextMonthDay:focus,
.flatpickr-day.selected:focus-visible,
.flatpickr-day.startRange:focus-visible,
.flatpickr-day.endRange:focus-visible,
.flatpickr-day.selected.prevMonthDay:focus-visible,
.flatpickr-day.startRange.prevMonthDay:focus-visible,
.flatpickr-day.endRange.prevMonthDay:focus-visible,
.flatpickr-day.selected.nextMonthDay:focus-visible,
.flatpickr-day.startRange.nextMonthDay:focus-visible,
.flatpickr-day.endRange.nextMonthDay:focus-visible {
    background-color: #392A3D;
    border-color: #392A3D;
    color: #fff;
    outline: none !important;

  .flatpickr-day.inRange,
  .flatpickr-day.inRange.nextMonthDay,
  .flatpickr-day.inRange.prevMonthDay {
    background: #EDE3DD; border-color: transparent;
    box-shadow: -5px 0 0 #EDE3DD, 5px 0 0 #EDE3DD; color: #392A3D;
  }
  
  /* Style for AVAILABLE days belonging to the previous or next month - NOT greyed out */
  .flatpickr-day.prevMonthDay:not(.disabled):not(.flatpickr-disabled),
  .flatpickr-day.nextMonthDay:not(.disabled):not(.flatpickr-disabled) {
      color: #495057 !important; /* Use standard dark text color - adjust if needed */
  }
  
  .flatpickr-day.startRange + .flatpickr-day.endRange {
    /* Remove the left border that might be showing the blue */
    border-left-color: transparent !important;
    /* Ensure the box-shadow connects using the END date's background */
    box-shadow: -5px 0 0 #392A3D !important; /* Use start/end color */
	}

  /* Add Padding Below Month Title */
  .flatpickr-weekdays {
    margin-top: 10px; 
  }

  .flatpickr-day.only-end-date {
    /* Optional: Add visual indication that this date can only be an end date */
    position: relative;
  }

  .flatpickr-day.only-end-date:after {
    content: "";
    position: absolute;
    bottom: 3px;
    right: 3px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #392A3D;
  }

</style>

<script>
  // --- Helper Function to format Date to YYYY-MM-DD ---
  function formatDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }


  // --- Function to Fetch Unavailable Dates (Verified in Step 2) ---
  async function fetchUnavailableDates(villaId, startDate, endDate) {
    // !!! --- Use your ACTUAL Vercel function URL --- !!!
    const apiUrl = 'https://mews-availability-js.vercel.app/api/mews-availability'; // Example URL
    // !!! --------------------------------------------- !!!

    console.log(`Fetching unavailability for ${villaId} from ${startDate} to ${endDate} via ${apiUrl}`);

    try {
      const response = await fetch(apiUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          villaId: villaId,
          startDate: startDate,
          endDate: endDate
        }),
      });

      if (!response.ok) {
        let errorDetails = `HTTP status ${response.status}`;
        try {
          const errorData = await response.json();
          errorDetails += `: ${errorData.details || errorData.error || await response.text()}`;
        } catch (e) {
          errorDetails += `: ${await response.text()}`;
        }
        console.error("Error fetching availability:", errorDetails);
        throw new Error(`Failed to fetch availability: ${errorDetails}`);
      }

      const data = await response.json();
      console.log("Received unavailable dates for Flatpickr:", data.unavailable);

      return {
        unavailable: data.unavailable || [],
        endOnlyDates: data.endOnlyDates || []
      };

    } catch (error) {
      console.error("Network or processing error fetching availability:", error);
      // Return empty array so Flatpickr can still initialize
      return { unavailable: [], endOnlyDates: [] };
    }
  }

  // Declare flatpickrInstance at a scope accessible to both functions
  let flatpickrInstance;

  // --- NEW: Function to Initialize Flatpickr (combines Steps 1 & 2) ---
  async function initializeCalendar(calendarId) {
    const calendarDiv = document.getElementById(calendarId);
    calendarDiv.innerText = "Loading availability data..."; // Update status

    // Get the villa ID from the data attribute
    const currentVillaId = calendarDiv.getAttribute("data-villa-id");

    if (!currentVillaId) {
      console.error("Villa ID is not set.");
      calendarDiv.innerText = "Error: Villa ID missing.";
      return;
    }

    // Define the date range to pre-fetch unavailability for
    const today = new Date();
    const startDateToFetch = new Date(today);
    const endDateToFetch = new Date(today);
    // Fetch a decent range ahead for better user experience
    endDateToFetch.setMonth(endDateToFetch.getMonth() + 12);

    const formattedStartDate = formatDate(startDateToFetch);
    const formattedEndDate = formatDate(endDateToFetch);

    // Fetch the dates BEFORE initializing Flatpickr
    const { unavailable: unavailableDates, endOnlyDates } = await fetchUnavailableDates(currentVillaId, formattedStartDate, formattedEndDate);

    // Build every date in that range, find the first available
    const allDates = [];
    let d = new Date(formattedStartDate);
    const end = new Date(formattedEndDate);
    while (d <= end) {
      allDates.push(formatDate(d));
      d.setDate(d.getDate() + 1);
    }
    const firstAvailable = allDates.find(date => !unavailableDates.includes(date));

    // Check if fetching failed (returned empty array despite trying)
    if (unavailableDates.length === 0) {
      console.warn("No unavailable dates received or fetch failed. Initializing calendar without specific disabled dates (except past).");
    }

    console.log(`Initializing Flatpickr for ${calendarId} with disabled dates:`, unavailableDates);
    calendarDiv.innerText = ""; // Clear loading message

    // Determine the number of months based on initial screen width
    const screenWidth = window.innerWidth;
    const monthsToShow = screenWidth < 720 ? 1 : 2;
    console.log(`Initial screen width: ${screenWidth}px, showing ${monthsToShow} month(s).`);

    // Initialize Flatpickr with specific selector
    return flatpickr(`#${calendarId}`, {
      inline: true,
      mode: "range",
      showMonths: monthsToShow,
      dateFormat: "Y-m-d",
      minDate: "today",
      disable: unavailableDates,
      onDayCreate: function(dObj, dStr, fp, dayElem) {
        const currentDate = dayElem.dateObj;
        const dayStr = formatDate(currentDate);
        
        // If this is Nov 7 and no dates selected yet, mark it as disabled for start date
        if (endOnlyDates.includes(dayStr) && fp.selectedDates.length === 0) {
          dayElem.classList.add("flatpickr-disabled");
          dayElem.classList.add("only-end-date");
          dayElem.title = "This date can only be used as an end date";
        }

         // anything after you pick one date…
        if (fp.selectedDates.length === 1) {
          // grab the check‑in
          const start = fp.selectedDates[0];

          // a) disable every date before your start
          if (currentDate < start) {
            dayElem.classList.add("flatpickr-disabled");
            return;
          }

          // b) disable any date that would jump over an end‑only date
          if (
            currentDate > start &&
            endOnlyDates.some(only => {
              const od = new Date(only);
              return od > start && od < currentDate;
            })
          ) {
            dayElem.classList.add("flatpickr-disabled");
          }
        }
      },
      onReady: (selectedDates, dateStr, instance) => {
        // compute `firstAvailable` as above…
        instance.jumpToDate(firstAvailable);
      },
      onChange: function(selectedDates, dateStr, instance) {
        // Original onChange logic
        if (selectedDates.length === 2) {
          console.log(`Selected range for ${calendarId}:`, dateStr);
        }
        
        // Add this part - re-enable Nov 7 after first date selection
        if (selectedDates.length === 1) {
          // Find and re-enable the specific date(s) that can only be end dates
          const onlyEndDateElements = document.querySelectorAll(".only-end-date");
          onlyEndDateElements.forEach(elem => {
            elem.classList.remove("flatpickr-disabled");
          });
          
          // Extra validation - if somehow Nov 7 was selected as start date, clear it
          const startDate = selectedDates[0];
          const startStr = formatDate(startDate);
          if (endOnlyDates.includes(startStr)) {
            instance.clear();
            alert("November 7, 2025 can only be selected as a check-out date");
          }
        }
      },
    });
  }

  function setupNextButtonHandler(calendarId, buttonId, villaId) {
    const nextButton = document.getElementById(buttonId);
    
    if (nextButton) {
      console.log(`Found Next button for ${calendarId}, adding listener.`);
      
      nextButton.addEventListener('click', () => {
        console.log(`Next button clicked for ${calendarId}!`);
        
        // Get the appropriate instance based on calendarId
        const instance = calendarId === "myCalendarContainer" ? 
                        window.flatpickrInstances.calendar1 : 
                        window.flatpickrInstances.calendar2;

        if (instance && instance.selectedDates.length === 2) {
          // Get the selected dates from the specific instance
          const selectedStartDate = instance.selectedDates[0];
          const selectedEndDate = instance.selectedDates[1];

          // Format the dates
          const startDateString = flatpickr.formatDate(selectedStartDate, "Y-m-d");
          const endDateString = flatpickr.formatDate(selectedEndDate, "Y-m-d");

          // Get promo code from input field
          const promoCodeInput = document.getElementById('promo-code-input');
          const voucherCodeString = promoCodeInput ? promoCodeInput.value.trim() : '';

          console.log(`Formatted Dates - Start: ${startDateString}, End: ${endDateString}`);

          // Use the villaId parameter to construct the URL
          const targetUrl = `https://app.mews.com/distributor/24478488-8110-4048-ad57-b1c400792e2b?mewsStart=${startDateString}&mewsEnd=${endDateString}&mewsRoute=rates&mewsRoom=${villaId}&mewsVoucherCode=${encodeURIComponent(voucherCodeString)}`;

          console.log("Redirecting to dynamic Mews URL:", targetUrl);
          window.location.href = targetUrl; // Perform the redirect
        } else {
          console.log("Check failed. Selected dates count:", 
                    instance ? instance.selectedDates.length : "instance not available");
          alert("Please select both a check-in and check-out date on the calendar first.");
        }
      });
    } else {
      console.error(`Could not find Next button (#${buttonId}) for ${calendarId}.`);
    }
  }
    
  // Store instances but don't initialize immediately
  window.flatpickrInstances = {};
  let calendar1Initialized = false;
  let calendar2Initialized = false;

  // Add event listeners to the specific buttons
  document.addEventListener('DOMContentLoaded', function() {
    // Buttons with the specific IDs from Webflow
    const galaxyButton = document.getElementById('Book-Galaxy-Villa');
    const stargazingButton = document.getElementById('Book-Stargazing-Villa');
    const switchGalaxyButton = document.getElementById('Switch-Galaxy-Villa');
    const switchStargazingButton = document.getElementById('Switch-Stargazing-Villa');
    
    // Function to handle Galaxy Villa calendar initialization/redraw
    function initGalaxyCalendar() {
      setTimeout(function() {
        if (!calendar1Initialized) {
          initializeCalendar("myCalendarContainer").then(instance => {
            window.flatpickrInstances.calendar1 = instance;
            calendar1Initialized = true;
            // Setup next button for Galaxy Villa
            setupNextButtonHandler("myCalendarContainer", "calendar-next-btn", "25e8c786-0920-46f0-bf62-b1c4007930c5");
          });
        } else {
          // Calendar exists but was hidden, force redraw
          window.flatpickrInstances.calendar1.redraw();
        }
      }, 100); // Small delay to ensure popup is visible
    }
    
    // Function to handle Stargazing Villa calendar initialization/redraw
    function initStargazingCalendar() {
      setTimeout(function() {
        if (!calendar2Initialized) {
          initializeCalendar("myCalendarContainer2").then(instance => {
            window.flatpickrInstances.calendar2 = instance;
            calendar2Initialized = true;
            // Setup next button for Stargazing Villa
            setupNextButtonHandler("myCalendarContainer2", "calendar-next-btn2", "eb50299f-e8cd-4462-9d16-b1c4007930c5");
          });
        } else {
          // Calendar exists but was hidden, force redraw
          window.flatpickrInstances.calendar2.redraw();
        }
      }, 100); // Small delay to ensure popup is visible
    }
    
    // Add click event listeners to all buttons
    if (galaxyButton) {
      galaxyButton.addEventListener('click', initGalaxyCalendar);
    }
    
    if (switchGalaxyButton) {
      switchGalaxyButton.addEventListener('click', initGalaxyCalendar);
    }
    
    if (stargazingButton) {
      stargazingButton.addEventListener('click', initStargazingCalendar);
    }
    
    if (switchStargazingButton) {
      switchStargazingButton.addEventListener('click', initStargazingCalendar);
    }
  });
  
</script>
