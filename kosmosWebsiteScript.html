<script>
  // --- Helper Function to format Date to YYYY-MM-DD ---
  function formatDate(date) {
    return date.toISOString().split('T')[0];
  }

  // --- Function to Fetch Unavailable Dates (Verified in Step 2) ---
  async function fetchUnavailableDates(villaId, startDate, endDate) {
    // !!! --- Use your ACTUAL Vercel function URL --- !!!
    const apiUrl = 'https://mews-availability-js.vercel.app/api/mews-availability'; // Example URL
    // !!! --------------------------------------------- !!!

    console.log(`Fetching unavailability for ${villaId} from ${startDate} to ${endDate} via ${apiUrl}`);

    try {
      const response = await fetch(apiUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          villaId: villaId,
          startDate: startDate,
          endDate: endDate
        }),
      });

      if (!response.ok) {
        let errorDetails = `HTTP status ${response.status}`;
        try {
          const errorData = await response.json();
          errorDetails += `: ${errorData.details || errorData.error || await response.text()}`;
        } catch (e) {
          errorDetails += `: ${await response.text()}`;
        }
        console.error("Error fetching availability:", errorDetails);
        throw new Error(`Failed to fetch availability: ${errorDetails}`);
      }

      const data = await response.json();
      console.log("Received unavailable dates for Flatpickr:", data.unavailable);
      return data.unavailable || [];

    } catch (error) {
      console.error("Network or processing error fetching availability:", error);
      // Return empty array so Flatpickr can still initialize
      return [];
    }
  }

  // Declare flatpickrInstance at a scope accessible to both functions
  let flatpickrInstance;

  // --- NEW: Function to Initialize Flatpickr (combines Steps 1 & 2) ---
  async function initializeCalendar(calendarId) {
    const calendarDiv = document.getElementById(calendarId);
    calendarDiv.innerText = "Loading availability data..."; // Update status

    // Get the villa ID from the data attribute
    const currentVillaId = calendarDiv.getAttribute("data-villa-id");

    if (!currentVillaId) {
      console.error("Villa ID is not set.");
      calendarDiv.innerText = "Error: Villa ID missing.";
      return;
    }

    // Define the date range to pre-fetch unavailability for
    const today = new Date();
    const startDateToFetch = new Date(today);
    const endDateToFetch = new Date(today);
    // Fetch a decent range ahead for better user experience
    endDateToFetch.setMonth(endDateToFetch.getMonth() + 6);

    const formattedStartDate = formatDate(startDateToFetch);
    const formattedEndDate = formatDate(endDateToFetch);

    // Fetch the dates BEFORE initializing Flatpickr
    const unavailableDates = await fetchUnavailableDates(
      currentVillaId,
      formattedStartDate,
      formattedEndDate
    );

    // Check if fetching failed (returned empty array despite trying)
    if (unavailableDates.length === 0) {
      console.warn("No unavailable dates received or fetch failed. Initializing calendar without specific disabled dates (except past).");
    }

    console.log(`Initializing Flatpickr for ${calendarId} with disabled dates:`, unavailableDates);
    calendarDiv.innerText = ""; // Clear loading message

    // Determine the number of months based on initial screen width
    const screenWidth = window.innerWidth;
    const monthsToShow = screenWidth < 720 ? 1 : 2;
    console.log(`Initial screen width: ${screenWidth}px, showing ${monthsToShow} month(s).`);

    // Initialize Flatpickr with specific selector
    return flatpickr(`#${calendarId}`, {
      inline: true,
      mode: "range",
      showMonths: monthsToShow,
      dateFormat: "Y-m-d",
      minDate: "today",
      disable: unavailableDates,
      onChange: function(selectedDates, dateStr, instance) {
        if (selectedDates.length === 2) {
          console.log(`Selected range for ${calendarId}:`, dateStr);
        }
      },
    });
  }

  function setupNextButtonHandler() {
      const nextButton = document.getElementById('calendar-next-btn');
      
      if (nextButton) {
          console.log("Found Next button, adding listener.");
          
          nextButton.addEventListener('click', () => {
              console.log("Next button clicked!");


              // --- CORRECTED Line 1: Check flatpickrInstance directly (no window.) ---
              if (flatpickrInstance && flatpickrInstance.selectedDates.length === 2) {

                  // --- Get the selected start date ---
                  const selectedStartDate = flatpickrInstance.selectedDates[0]; // No window.

                  // --- Get the selected end date ---
                  const selectedEndDate = flatpickrInstance.selectedDates[1]; // No window.

                  // --- Format the start date to YYYY-MM-DD ---
                  const startDateString = flatpickr.formatDate(selectedStartDate, "Y-m-d");

                  // --- Format the end date to YYYY-MM-DD ---
                  const endDateString = flatpickr.formatDate(selectedEndDate, "Y-m-d");

                  // Get promo code from input field
                  const promoCodeInput = document.getElementById('promo-code-input');
                  const voucherCodeString = promoCodeInput ? promoCodeInput.value.trim() : '';

                  console.log(`Formatted Dates - Start: ${startDateString}, End: ${endDateString}`);

                  // --- Construct the URL dynamically ---
                  const targetUrl = `https://app.mews.com/distributor/24478488-8110-4048-ad57-b1c400792e2b?mewsStart=${startDateString}&mewsEnd=${endDateString}&mewsRoute=rates&mewsRoom=25e8c786-0920-46f0-bf62-b1c4007930c5&mewsVoucherCode=${encodeURIComponent(voucherCodeString)}`;

                  console.log("Redirecting to dynamic Mews URL:", targetUrl);
                  window.location.href = targetUrl; // Perform the redirect

              } else {
                  // --- Keep the debugging logs here ---
                  console.log("Check failed. Current state:");
                  // Check if the instance exists at all in this scope
                  if (typeof flatpickrInstance === 'undefined') {
                      console.error("flatpickrInstance is UNDEFINED in this scope!");
                  } else if (flatpickrInstance === null) {
                      console.error("flatpickrInstance is NULL (was it initialized?)");
                  } else {
                      // If instance exists, log the number of selected dates
                      console.log("flatpickrInstance exists. Selected dates count:", flatpickrInstance.selectedDates.length);
                  }
                  alert("Please select both a check-in and check-out date on the calendar first.");
              }
          });

      } else {
          console.error("Could not find Next button (#calendar-next-btn).");
      }
    }

  // --- Wait for the document and run initialization ---
  // Modify your document ready function to initialize both calendars
  document.addEventListener('DOMContentLoaded', function() {
    console.log("Document loaded. Initializing calendars...");
    
    // Create object to store both instances
    window.flatpickrInstances = {};
    
    // Initialize first calendar
    initializeCalendar("myCalendarContainer").then(instance => {
      window.flatpickrInstances.calendar1 = instance;
      
      // Setup button handler for first calendar if needed
      setupNextButtonHandler("myCalendarContainer", instance, "calendar-next-btn");
    }).catch(error => {
      console.error("Failed to initialize first calendar:", error);
      document.getElementById("myCalendarContainer").innerText = `Error initializing calendar: ${error.message}`;
    });
    
    // Initialize second calendar
    initializeCalendar("myCalendarContainer2").then(instance => {
      window.flatpickrInstances.calendar2 = instance;
      
      // Setup button handler for second calendar if needed
      setupNextButtonHandler("myCalendarContainer2", instance, "calendar-next-btn2");
    }).catch(error => {
      console.error("Failed to initialize second calendar:", error);
      document.getElementById("myCalendarContainer2").innerText = `Error initializing calendar: ${error.message}`;
    });
  });

</script>
